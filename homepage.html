<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>symbiography</title>
  <link rel="stylesheet" href="styles.css"/>

</head>

<body>
    <div class="page-container">
        <header class="page-header">
            <div class="logo"> <!--not a navigation block thus div works-->
                <a href="homepage.html">E</a>
            </div>
            <nav class="main-nav-items">
                    <h4> <a href="about-page.html">about</a></h4>
            </nav>
        </header>

        <main class="page-main">
    
            <!-- HERO SECTION -->
            <div class="hero-section">
                <span class="heading"><h1>symbiography</h1></span>
                <span class="subheading"><h3>essays on human-machine mapping</h3></span>
            </div>
    
            <!-- LATEST ENTRY -->
            <div class="latest-entry-container">
                <div class="latest-entry"><h4>LATEST</h4></div>
                <div class="latest-entry-content">
                    <span class="entry-title"><h2>title</h2></span>
                    <div class="entry-metadata">
                        <time class="entry-date" datetime="2025-03-02"><h5>date</h5></time>
                        <span class="separator"><h5> . </h5></span>
                        <span class="read-time"><h5>time minute read</h5></span>
                    </div>
                    <div class="entry-subtitle"><h5>...</h5></div>
                </div>
            </div>

            <!-- SCROLL CONTAINER -->
            <div class="article-scroll-container">
                <span class="entries-title"><h4>ENTRIES</h4></span>

                <div class="entries-container" aria-live="polite">
                    <article class="entry-row">
                        <time datetime="2025-09-06">date</time>
                        <span class="separator"><h5> . </h5></span>
                        <a href="test.html">article title</a> 
                    </article>
                </div>
            </div>
    
            <!-- FOOTER -->
            <div class="footer-quote">
                    <h4>How do we shape technology, <br> and how does technology shape us?</h4>
            </div>
        </main>
    
        <div class="footer">
            <div class="footer-content">
                <p>© 2026 elisa nguyen</p>
            </div>
        </div>
    </div>

    <script>
        (async function () {
          const res = await fetch("data/articles.json");
          if (!res.ok) return;
          const articles = await res.json();
      
          articles.sort((a, b) => String(b.date).localeCompare(String(a.date)));
          const latest = articles[0];
          const entries = articles.slice(1, 6);
      
          if (latest) {
            document.querySelector(".latest-entry-content .entry-title h2").textContent = latest.title;
            const timeEl = document.querySelector(".latest-entry-content .entry-date");
            timeEl.dateTime = latest.date;
            timeEl.textContent = latest.dateLabel || latest.date;
            document.querySelector(".latest-entry-content .read-time").textContent = latest.readTime || "";
            document.querySelector(".latest-entry-content .entry-subtitle").textContent = latest.subheading || "";
            const link = document.querySelector(".latest-entry-container a.latest-entry-link");
            if (link) link.href = latest.url;
          }
      
          const list = document.querySelector(".entries-container");
          if (list && entries.length) {
            list.innerHTML = entries
              .map(
                (a) =>
                  `<article class="entry-row"><a href="${a.url}">${a.title}</a> <time datetime="${a.date}">${a.dateLabel || a.date}</time></article>`
              )
              .join("");
          }
        })();
      </script>

</body>
</html>
